project:
  type: website
  output-dir: docs
  resources:
    - ".nojekyll"
    - "files/"

website:
  title: "Kaylee Pascarella"
  description: "Statistician working on clinical trial methodology and applied predictive modeling."
  favicon: images/favicon.png
  navbar:
    pinned: false
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: cv.qmd
        text: CV
  page-footer:
    left: "Kaylee Pascarella"
    right: "Built with Quarto"

format:
  html:
    theme: [default, styles.scss]
    toc: false
    page-layout: article
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
    include-before-body:
      - _background.html
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
